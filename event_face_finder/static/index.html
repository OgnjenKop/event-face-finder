<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Event Face Finder</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">EF</div>
          <div>
            <h1>Event Face Finder</h1>
            <p>Local face search</p>
          </div>
        </div>

        <form id="scan-form" class="scan-form">
          <fieldset class="scan-fieldset">
            <legend class="visually-hidden">Scan settings</legend>
            <div id="form-message" class="form-message" role="status" aria-live="polite" hidden></div>

          <label>
            <span>Person ID</span>
            <input
              id="person-id"
              name="person_id"
              list="known-people"
              autocomplete="off"
              placeholder="alex"
            />
            <datalist id="known-people"></datalist>
          </label>

          <label>
            <span>Reference folder</span>
            <div class="input-action">
              <input
                id="reference-dir"
                name="reference_dir"
                autocomplete="off"
                placeholder="reference_people/alex"
              />
              <button
                class="picker-button"
                type="button"
                data-picker="reference-dir"
                aria-label="Choose reference folder"
              >
                Choose
              </button>
            </div>
          </label>

          <label>
            <span>Photo folders</span>
            <div class="textarea-action">
              <textarea
                id="photos-roots"
                name="photos_roots"
                rows="5"
                placeholder="/path/to/event/photos"
              ></textarea>
              <button
                class="picker-button"
                type="button"
                data-picker="photos-roots"
                aria-label="Choose photo folders"
              >
                Choose
              </button>
            </div>
          </label>

          <div class="grid-2">
            <label>
              <span>High</span>
              <input
                id="high-threshold"
                name="high_threshold"
                type="number"
                min="0"
                max="1"
                step="0.01"
                value="0.43"
                aria-describedby="threshold-hint"
              />
            </label>
            <label>
              <span>Review</span>
              <input
                id="review-threshold"
                name="review_threshold"
                type="number"
                min="0"
                max="1"
                step="0.01"
                value="0.34"
                aria-describedby="threshold-hint"
              />
            </label>
          </div>
          <p id="threshold-hint" class="field-hint">Review must be ≤ High, both between 0 and 1.</p>

          <details>
            <summary>Settings</summary>
            <div class="settings">
              <label>
                <span>Workspace</span>
                <div class="input-action">
                  <input id="workspace" name="workspace" value="outputs" />
                  <button
                    class="picker-button"
                    type="button"
                    data-picker="workspace"
                    aria-label="Choose workspace folder"
                  >
                    Choose
                  </button>
                </div>
              </label>
              <label>
                <span>Cache path</span>
                <input id="cache-path" name="cache_path" placeholder="outputs/cache.sqlite" />
              </label>
              <div class="grid-2">
                <label>
                  <span>Provider</span>
                  <select id="provider" name="provider">
                    <option value="cpu">CPU</option>
                    <option value="coreml">CoreML</option>
                  </select>
                </label>
                <label>
                  <span>Export</span>
                  <select id="export-mode" name="export_mode">
                    <option value="symlink">Symlink</option>
                    <option value="copy">Copy</option>
                  </select>
                </label>
              </div>
              <div class="grid-2">
                <label>
                  <span>Max image</span>
                  <input id="max-image-size" name="max_image_size" type="number" value="2200" />
                </label>
                <label>
                  <span>Chunk</span>
                  <input id="chunk-size" name="chunk_size" type="number" value="500" />
                </label>
              </div>
              <label>
                <span>Minimum reference faces</span>
                <input
                  id="min-reference-faces"
                  name="min_reference_faces"
                  type="number"
                  min="1"
                  value="5"
                />
              </label>
            </div>
          </details>

          <div class="actions">
            <button id="start-button" class="primary" type="submit">Start scan</button>
            <button id="stop-button" class="secondary" type="button">Stop</button>
          </div>
          </fieldset>
        </form>
      </aside>

      <main class="workspace">
        <section class="status-strip" aria-live="polite">
          <div>
            <span class="label">Status</span>
            <strong id="status">Idle</strong>
            <div id="status-note" class="status-note"></div>
            <progress
              id="progress-bar"
              class="progress-bar"
              value="0"
              max="100"
              aria-label="Scan progress"
              hidden
            ></progress>
            <div id="progress-label" class="progress-label muted" hidden></div>
          </div>
          <div>
            <span class="label">High</span>
            <strong id="high-count">0</strong>
          </div>
          <div>
            <span class="label">Review</span>
            <strong id="review-count">0</strong>
          </div>
          <div>
            <span class="label">Total</span>
            <strong id="total-count">0</strong>
          </div>
        </section>

        <section class="result-layout">
          <div class="panel">
            <div class="panel-head">
              <h2>Results</h2>
              <button id="refresh-results" class="ghost" type="button" aria-label="Refresh">
                Refresh
              </button>
            </div>
            <div id="paths" class="paths"></div>
            <div id="contact-sheets" class="contact-sheets"></div>
            <div id="sheets-pagination" class="pagination" hidden></div>
          </div>

          <div class="panel log-panel">
            <div class="panel-head">
              <h2>Run Log</h2>
              <div class="log-actions">
                <button id="clear-log" class="ghost" type="button" aria-label="Hide older log lines">
                  Hide older
                </button>
                <span id="return-code" class="muted" aria-live="polite"></span>
              </div>
            </div>
            <pre id="log" aria-live="polite"></pre>
          </div>
        </section>
      </main>
    </div>

    <div
      id="lightbox"
      class="lightbox"
      role="dialog"
      aria-modal="true"
      aria-label="Contact sheet preview"
      hidden
    >
      <button id="lightbox-close" class="lightbox-close" type="button" aria-label="Close preview">
        ×
      </button>
      <img id="lightbox-image" alt="" />
    </div>

    <script src="/static/app.js"></script>
  </body>
</html>
