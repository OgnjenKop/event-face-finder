[project]
name = "event-face-finder"
version = "0.1.0"
description = "Local InsightFace-based face search for large event photo folders"
requires-python = ">=3.10"
dependencies = [
  "insightface>=0.7.3",
  "onnxruntime>=1.17.0",
  "opencv-python>=4.9.0",
  "numpy>=1.24.0",
  "pillow>=10.0.0",
  "tqdm>=4.66.0",
]

[project.scripts]
event-face-finder = "event_face_finder.cli:main"

[tool.ruff]
line-length = 100
